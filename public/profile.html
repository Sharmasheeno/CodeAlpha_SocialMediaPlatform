<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile · SocialSphere</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container" style="max-width:720px">
    <div class="card" id="profile-head"><p class="muted">Loading profile...</p></div>

    <div class="card hidden" id="edit-card">
      <h3>Edit your profile</h3>
      <form id="edit-form">
        <label for="edit-displayName">Display name</label>
        <input type="text" id="edit-displayName" maxlength="60">
        <label for="edit-bio">Bio</label>
        <textarea id="edit-bio" rows="3" maxlength="280"></textarea>
        <div class="error hidden" id="edit-error"></div>
        <p class="muted hidden" id="edit-success"></p>
        <button class="btn" type="submit">Save changes</button>
      </form>
    </div>

    <h3>Posts</h3>
    <div id="profile-posts"><div class="card"><p class="muted">Loading posts...</p></div></div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
